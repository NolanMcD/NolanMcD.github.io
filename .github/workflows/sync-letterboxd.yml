name: Sync Letterboxd reviews

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: letterboxd-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v6

      - name: Merge Letterboxd RSS into Film Diary
        shell: powershell
        run: .\tools\sync-letterboxd.ps1

      - name: Commit new reviews
        shell: powershell
        run: |
          $changes = git status --porcelain -- assets/data/film-diary.json assets/data/latest-letterboxd.json assets/data/rating-distribution.json
          if (-not $changes) {
            Write-Host "No new Letterboxd activity."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/film-diary.json assets/data/latest-letterboxd.json assets/data/rating-distribution.json
          git commit -m "Sync Letterboxd film diary"
          git push
