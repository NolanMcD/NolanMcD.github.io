name: Check site

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Morning Miami Weather Report
      - Sync Letterboxd reviews
      - Sync public Strava activities
      - Sync Blood Manatees packing montage
    types: [completed]
    branches: [main]

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v6

      - name: Validate repository content
        shell: pwsh
        run: ./tools/check-site.ps1

      - name: Verify Letterboxd rating counts and importer
        run: python3 tools/test-rating-distribution.py

      - name: Verify director ranking snapshot
        run: python3 tools/test-director-rankings.py

      - name: Test Triple Atlas import and owner storage
        run: python3 tools/test-triple-atlas.py

      - name: Test weather collection and publication
        run: |
          python3 -m pip install -r tools/miami-weather-requirements.txt
          python3 tools/test-miami-weather.py

      - name: Set up Node for client checks
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test Blanket definition and explorer
        run: |
          python3 -m pip install -r tools/blanket-requirements.txt
          python3 tools/test-blanket.py
          python3 tools/test-blanket-expanded.py
          python3 tools/test-blanket-validation.py
          python3 tools/build-blanket-notebook.py --check
          node tools/test-blanket-ui.cjs

      - name: Test Blood Manatees airport scene
        run: node tools/test-blood-manatees-airport.cjs

      - name: Test Blood Manatees Miami arrival
        run: node tools/test-blood-manatees-arrival.cjs

      - name: Test director ranking controls
        run: node tools/test-director-rankings-ui.cjs

      - name: Test Writing and Projects filters
        run: node tools/test-work-filters.cjs

      - name: Test Triple Atlas owner connection recovery
        run: node --test tools/test-triple-atlas-auth.cjs

      - name: Test Triple Atlas exploration and share links
        run: node --test tools/test-triple-atlas-explorer.cjs

      - name: Test weather stale labels
        run: node --test tools/test-miami-weather-ui.cjs

      - name: Test Triple Atlas DOM interactions
        run: |
          npm install --prefix "$RUNNER_TEMP/atlas-dom" --ignore-scripts --no-audit --no-fund jsdom@30.1.2
          NODE_PATH="$RUNNER_TEMP/atlas-dom/node_modules" node --test tools/test-triple-atlas-ui.cjs

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --strict_front_matter

      - name: Check built navigation links
        run: python3 tools/check-navigation.py _site

      - name: Check built weather archive and image references
        run: python3 tools/check-miami-weather.py _site

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install locked browser test dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test the built site in desktop and phone browsers
        run: |
          bundle exec ruby tools/build-running-previews.rb
          pnpm test:browser

      - name: Remove temporary mileage samples before publishing
        run: bundle exec ruby tools/build-running-previews.rb --clean

      - name: Keep browser reports and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload tested site for deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy the tested site
        id: deployment
        uses: actions/deploy-pages@v4
