name: Check site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v6

      - name: Validate repository content
        shell: pwsh
        run: ./tools/check-site.ps1

      - name: Verify Letterboxd rating counts and importer
        run: python3 tools/test-rating-distribution.py

      - name: Test Triple Atlas import and owner storage
        run: python3 tools/test-triple-atlas.py

      - name: Set up Node for client checks
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test Triple Atlas owner connection recovery
        run: node --test tools/test-triple-atlas-auth.cjs

      - name: Test Triple Atlas exploration and share links
        run: node --test tools/test-triple-atlas-explorer.cjs

      - name: Test Triple Atlas DOM interactions
        run: |
          npm install --prefix "$RUNNER_TEMP/atlas-dom" --ignore-scripts --no-audit --no-fund jsdom@30.1.2
          NODE_PATH="$RUNNER_TEMP/atlas-dom/node_modules" node --test tools/test-triple-atlas-ui.cjs

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --strict_front_matter

      - name: Check built navigation links
        run: python3 tools/check-navigation.py _site
