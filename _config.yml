title: "Noland"
tagline: "Movies, reviews, and the occasional side quest"
email: "boltjets24@gmail.com"
description: >-
  Nolan McDermott reviews movies and writes about cinema, personal projects,
  sports, travel, and ambitious side quests.
baseurl: ""
url: "https://noland.blog"
lang: en-US
timezone: America/New_York
github_username: NolanMcD
theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  blood_manatees:
    output: true
    permalink: /blood-manatees/scene/:name/

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax

minima:
  social_links:
    - { platform: github, user_url: "https://github.com/NolanMcD" }
    - { platform: linkedin, user_url: "https://www.linkedin.com/in/nolan-mcdermott-b9a20220b/" }
    - { platform: letterboxd, user_url: "https://letterboxd.com/NolanMcD/" }
    - { platform: strava, user_url: "https://www.strava.com/athletes/57377386" }
    - { platform: x, user_url: "https://x.com/NolanMcDerm" }
    - { platform: instagram, user_url: "https://www.instagram.com/nolan_mcdermott/" }
    - { platform: youtube, user_url: "https://www.youtube.com/@NolanMcD" }

show_excerpts: true

header_pages:
  - pages/reviews.md
  - pages/screenplays.md
  - pages/miami-storms.md
  - pages/about.md
  - pages/projects.md

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: blood_manatees
    values:
      layout: blood-manatees-scene
      sitemap: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - reviews.csv
  - local-data
  - tools
  - vendor
