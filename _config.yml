title: "Nolan McDermott"
tagline: "Computer science, sports analytics, and ambitious side quests"
email: "boltjets24@gmail.com"
description: >-
  Nolan McDermott's portfolio and field notes on computer science,
  mathematics, sports analytics, travel, and long-running adventures.
baseurl: ""
url: "https://nolanmcd.github.io"
lang: en-US
timezone: America/New_York
github_username: NolanMcD
theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax

minima:
  social_links:
    - { platform: github, user_url: "https://github.com/NolanMcD" }
    - { platform: linkedin, user_url: "https://www.linkedin.com/in/nolan-mcdermott-b9a20220b/" }
    - { platform: letterboxd, user_url: "https://letterboxd.com/NolanMcD/" }
    - { platform: strava, user_url: "https://www.strava.com/athletes/57377386" }
    - { platform: x, user_url: "https://x.com/NolanMcDerm" }
    - { platform: instagram, user_url: "https://www.instagram.com/nolan_mcdermott/" }
    - { platform: youtube, user_url: "https://www.youtube.com/@NolanMcD" }

show_excerpts: true

header_pages:
  - about.md
  - projects.md

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - README.md
  - CNAME.example
  - Gemfile
  - Gemfile.lock
